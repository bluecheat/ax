# .ax/config.yml
# goax triage / audit / hooks 가 참조하는 프로젝트 설정.
# 자기 프로젝트에 맞게 수정해.

# ───────────────────────────────────────────────────────────
# Model tier — 하네스 행동 스캐폴딩 강도
#   frontier  lean 하네스 (기본). 행동 가이드 최소, 결정론(Sensors·스크립트) 중심.
#             최신 상위 모델은 행동 지시가 적을수록 잘 작동해요.
#   standard  경량·구세대·타사 모델용. behavioral-baseline 복원 권장:
#             cp .ax/_templates/spirit/behavioral-baseline.md .ax/spirit/ 후
#             AGENTS.md CONVENTION 섹션에 @.ax/spirit/behavioral-baseline.md 추가
# ───────────────────────────────────────────────────────────
model_tier: frontier

# ───────────────────────────────────────────────────────────
# 도메인 위험도 매트릭스 — /triage 가 키워드로 매칭
# 키: 영문(kebab-case) 도메인 이름. 값: L0|L1|L2|L3
#
# ❗ 규칙
#   - 키는 영문만. 한글은 주석으로 (예: payment: L3   # 결제, PG, 환불)
#   - 같은 도메인을 영문/한글 별도 키로 두지 않음 (중복·매칭 충돌 방지)
#   - triage가 사용자 메시지의 한글을 영문 키로 의역해서 매칭함 (LLM 처리)
# ───────────────────────────────────────────────────────────
default_risk: L0

domain_risk:
  # 예시 — 자기 프로젝트로 교체. 도메인 키는 영문 kebab-case.
  # L3 = 비가역 손실 가능 영역 (돈/의료/안전/장부/자격증명)
  payment: L3            # 결제, PG, 환불
  # billing: L3          # 청구·구독·정산
  # phi-access: L3       # 의료 정보 (PHI/EHR) 접근
  # safety-control: L3   # 안전·제어 시스템 (의료기기·산업)
  # ledger: L3           # 회계 장부 무결성
  # auth-credential: L3  # 인증·자격증명 발급/검증
  order: L2              # 주문, 발주
  product: L1            # 상품, 카탈로그
  search: L0             # 검색

# ───────────────────────────────────────────────────────────
# 빌드/테스트/린트 명령 — Sensors 와 doctor 가 참조
# ───────────────────────────────────────────────────────────
commands:
  build: ""             # 예: pnpm build, ./gradlew build, cargo build
  test: ""              # 예: pnpm test, ./gradlew test, cargo test
  lint: ""              # 예: pnpm lint, ./gradlew ktlintCheck, ruff check
  typecheck: ""         # 예: pnpm typecheck, ./gradlew compileKotlin

# ───────────────────────────────────────────────────────────
# Sensors — hooks 강도
# ───────────────────────────────────────────────────────────
sensors:
  mode: warning         # warning | fail
  block_destructive: true
  # 사용자가 직접 편집하면 안 되는 파일/디렉토리. onboarding과 일상 작업이 합법적으로
  # 쓰는 경로(.ax/modules/, .ax/docs/, .ax/spirit/rules/, .ax/adoption-plan.md, .ax/mistakes/)는
  # 의도적으로 제외 — 통째 .ax/ prefix는 자기충돌(mistake 누적) 유발.
  protected_paths:
    - CLAUDE.md
    - .ax/config.yml
    - .ax/version
    - .ax/state.json
    - .ax/current-task.json
    - .ax/hooks/
    - .ax/scripts/
    - .ax/spirit/values.md
    - .ax/spirit/tone.md
    - .ax/_templates/
    - .claude/settings.json
    - .github/workflows/

# ───────────────────────────────────────────────────────────
# Confirmation Friction Policy
# 사람 확인을 데이터로 결정 — 무차별 묻기·자동 둘 다 anti-pattern.
# 정책 SSOT: .ax/docs/reference/confirmation-policy.md
# ───────────────────────────────────────────────────────────
confirmation:
  # 기본 friction 모드 — spec-implement 의 task 루프 동작 결정
  #   phase_gate  Phase 경계에서만 사람 확인 (권장)
  #   per_task    매 task [y/n] (구버전 동작, 비권장)
  #   autopilot   Phase 경계도 묻지 않음, 실패 시에만 halt
  mode: phase_gate

  # L3 도메인은 mode 불문 task 게이트 강제
  #   per_task | phase_gate | off
  l3_override: per_task

  # 같은 카테고리 mistake 누적 ≥ N → 그 카테고리 task 자동 게이트 강화
  mistake_threshold: 3

  # SP-SEC-* / SP-DATA-* 매칭 task 는 risk≥L2 시 게이트 강제 (C5 룰)
  spirit_severity_gate: true

# ───────────────────────────────────────────────────────────
# Mistake Loop
# ───────────────────────────────────────────────────────────
mistake_loop:
  promotion_threshold: 3     # 같은 카테고리 N회 이상 → CRITICAL 승격 권고
  audit_cadence_days: 7

# ───────────────────────────────────────────────────────────
# HUD (statusline) — .ax/hud/statusline.sh
#   [goax#0.5.1] | M×L2 · payment | spec ✓ › tasks ✓ › impl ● [######----]7/12 › review ○ | mistakes:3
#   이 블록이 없으면 focused · ascii 로 동작해요 (기존 설치는 키가 안 내려와도 괜찮아요).
# ───────────────────────────────────────────────────────────
hud:
  preset: focused       # minimal (1줄, 현재 단계만) | focused (1줄, 체인 전체) | full (2줄 — spec 슬러그·tier·다음 단계)
  bars: ascii           # ascii ([######----]) | unicode (█░)
