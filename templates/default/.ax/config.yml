# .ax/config.yml
# goax triage / audit / hooks 가 참조하는 프로젝트 설정.
# 자기 프로젝트에 맞게 수정해.

# ───────────────────────────────────────────────────────────
# 도메인 위험도 매트릭스 — /triage 가 키워드로 매칭
# 키: 영문(kebab-case) 도메인 이름. 값: L0|L1|L2|L3
#
# ❗ 규칙
#   - 키는 영문만. 한글은 주석으로 (예: payment: L3   # 결제, PG, 환불)
#   - 같은 도메인을 영문/한글 별도 키로 두지 않음 (중복·매칭 충돌 방지)
#   - triage가 사용자 메시지의 한글을 영문 키로 의역해서 매칭함 (LLM 처리)
# ───────────────────────────────────────────────────────────
default_risk: L0

domain_risk:
  # 예시 — 자기 프로젝트로 교체
  payment: L3       # 결제, PG, 환불
  order: L2         # 주문, 발주
  product: L1       # 상품, 카탈로그
  search: L0        # 검색

# ───────────────────────────────────────────────────────────
# 빌드/테스트/린트 명령 — Sensors 와 doctor 가 참조
# ───────────────────────────────────────────────────────────
commands:
  build: ""             # 예: pnpm build, ./gradlew build, cargo build
  test: ""              # 예: pnpm test, ./gradlew test, cargo test
  lint: ""              # 예: pnpm lint, ./gradlew ktlintCheck, ruff check
  typecheck: ""         # 예: pnpm typecheck, ./gradlew compileKotlin

# ───────────────────────────────────────────────────────────
# Sensors — hooks 강도
# ───────────────────────────────────────────────────────────
sensors:
  mode: warning         # warning | fail
  block_destructive: true
  # 사용자가 직접 편집하면 안 되는 파일/디렉토리. onboarding과 일상 작업이 합법적으로
  # 쓰는 경로(.ax/modules/, .ax/docs/, .ax/spirit/rules/, .ax/adoption-plan.md, .ax/mistakes/)는
  # 의도적으로 제외 — 통째 .ax/ prefix는 자기충돌(mistake 누적) 유발.
  protected_paths:
    - CLAUDE.md
    - .ax/config.yml
    - .ax/version
    - .ax/state.json
    - .ax/current-task.json
    - .ax/hooks/
    - .ax/scripts/
    - .ax/spirit/values.md
    - .ax/spirit/tone.md
    - .ax/docs/_templates/
    - .claude/settings.json
    - .github/workflows/

# ───────────────────────────────────────────────────────────
# Mistake Loop
# ───────────────────────────────────────────────────────────
mistake_loop:
  promotion_threshold: 3     # 같은 카테고리 N회 이상 → CRITICAL 승격 권고
  audit_cadence_days: 7
