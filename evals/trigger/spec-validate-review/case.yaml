schema_version: "1.1"
name: trigger-spec-validate-review
description: "spec 합의 리뷰 — 하네스 진단(doctor)·구현 완료 게이트와 구분"
tags: [trigger, doctor, spec-implement, spec-validate]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "payment-refund spec 구현 들어가기 전에 빠진 거 없는지 합의 리뷰 받아보자"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-spec-validate
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-validate"'
    min: 1
  - name: not-doctor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?doctor"'
    min: 0
    max: 0
    arm: both
  - name: not-spec-implement
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-implement"'
    min: 0
    max: 0
    arm: both
