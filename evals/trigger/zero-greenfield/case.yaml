schema_version: "1.1"
name: trigger-zero-greenfield
description: "greenfield 0→1 — 기능 요청(triage)·brownfield(onboarding)와 구분"
tags: [trigger, onboarding, triage, zero]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "빈 리포에서 시작하는 새 제품이야. 코드 말고 아이디어부터 같이 정리하자"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-zero
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?zero"'
    min: 1
  - name: not-triage
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?triage"'
    min: 0
    max: 0
    arm: both
  - name: not-onboarding
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?onboarding"'
    min: 0
    max: 0
    arm: both
