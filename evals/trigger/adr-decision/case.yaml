schema_version: "1.1"
name: trigger-adr-decision
description: "'기록' 이 들어간 근접 표현 — 실수 기록(mistake)이 아니라 결정 기록"
tags: [trigger, adr, mistake, spec]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "결제 저장소를 Postgres 로 정한 이유를 결정 기록으로 남겨줘"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-adr
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?adr"'
    min: 1
  - name: not-mistake
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?mistake"'
    min: 0
    max: 0
    arm: both
  - name: not-spec
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec"'
    min: 0
    max: 0
    arm: both
