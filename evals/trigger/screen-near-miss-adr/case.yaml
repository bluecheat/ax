schema_version: "1.1"
name: trigger-screen-near-miss-adr
description: "스타일링 결정 기록 — adr, screen 아님"
tags: [trigger, screen, adr]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "화면 스타일링을 Tailwind 대신 CSS Modules 로 가기로 했어, 그 결정 기록 남겨줘"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-adr
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?adr"'
    min: 1
  - name: not-screen
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?screen"'
    min: 0
    max: 0
    arm: both
