schema_version: "1.1"
name: trigger-spec-implement-start
description: "'구현' 이 들어간 근접 표현 — triage 가 아니라 tasks.md 실행이에요"
tags: [trigger, lane, spec-implement, triage]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "payment-refund tasks.md 다 나왔으니 구현 시작하자. 첫 번째 미완료 task 부터 진행해줘"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-spec-implement
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-implement"'
    min: 1
  - name: not-triage
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?triage"'
    min: 0
    max: 0
    arm: both
  - name: not-lane
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?lane"'
    min: 0
    max: 0
    arm: both
