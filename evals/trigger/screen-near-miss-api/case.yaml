schema_version: "1.1"
name: trigger-screen-near-miss-api
description: "API 작업 — screen 아님"
tags: [trigger, screen, triage]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "상품 목록 API 응답에 썸네일 URL 필드 추가해줘"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-triage
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?triage"'
    min: 1
  - name: not-screen
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?screen"'
    min: 0
    max: 0
    arm: both
