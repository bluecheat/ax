schema_version: "1.1"
name: trigger-triage-feature
description: "새 기능 요청 — triage 가 먼저. '구현 시작' 류의 spec-implement 로 새면 안 돼요"
tags: [trigger, spec-implement, triage]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "주문 목록 API 에 커서 기반 페이지네이션 추가해줘"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-triage
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?triage"'
    min: 1
  - name: not-spec-implement
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-implement"'
    min: 0
    max: 0
    arm: both
