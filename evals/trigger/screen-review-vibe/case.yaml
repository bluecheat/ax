schema_version: "1.1"
name: trigger-screen-review-vibe
description: "있는 화면 리뷰 — screen, triage 아님"
tags: [trigger, screen, triage]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "이 결제 화면 스크린샷인데 뭔가 촌스럽고 답답해. 어디가 문제야?"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-screen
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?screen"'
    min: 1
  - name: not-triage
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?triage"'
    min: 0
    max: 0
    arm: both
