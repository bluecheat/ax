schema_version: "1.1"
name: trigger-rule-compress
description: "길어진 룰 줄이기 — 진단(doctor)과 구분"
tags: [trigger, rule]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "data 룰 파일이 너무 길어. 룰 압축해줘"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-rule
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?rule"'
    min: 1
  - name: not-doctor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?doctor"'
    min: 0
    max: 0
    arm: both
