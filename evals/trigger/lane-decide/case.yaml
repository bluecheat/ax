schema_version: "1.1"
name: trigger-lane-decide
description: "가를 수 있는지 판정 — 실행(spec-implement)으로 바로 가면 안 돼요"
tags: [trigger, lane, spec-implement]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "이 tasks 를 에이전트 몇 개로 나눠서 동시에 돌릴 수 있을지 먼저 봐줘"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-lane
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?lane"'
    min: 1
  - name: not-spec-implement
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?spec-implement"'
    min: 0
    max: 0
    arm: both
