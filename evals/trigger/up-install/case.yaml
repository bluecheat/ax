schema_version: "1.1"
name: trigger-up-install
description: "설치 — 진단·onboarding 으로 먼저 새면 안 돼요 (onboarding 은 up 이 끝난 뒤 이어받아요)"
tags: [trigger, doctor, onboarding, up]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "이 리포에 goax 설치해줘"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-up
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?up"'
    min: 1
  - name: not-doctor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?doctor"'
    min: 0
    max: 0
    arm: both
  - name: not-onboarding
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?onboarding"'
    min: 0
    max: 0
    arm: both
