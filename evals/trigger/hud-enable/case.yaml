schema_version: "1.1"
name: trigger-hud-enable
description: "statusline 설정 — 진단과 구분"
tags: [trigger, doctor, hud]
# skill 고르기만 재요 — scaffold·hook shim 없이 description 만으로 고르는지 봐요 (README '트리거 스위트')
plugins: ["../../.."]
execution:
  prompt: "goax HUD 활성화해줘"
  max_turns: 4
  timeout_seconds: 180
  allowed_tools: [Skill]
graders:
  - name: fires-hud
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?hud"'
    min: 1
  - name: not-doctor
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?doctor"'
    min: 0
    max: 0
    arm: both
